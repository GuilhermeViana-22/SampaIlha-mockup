# Dokploy — frontend Portal Sampa na Ilha (Nuxt 4 SSR)
# URL: https://sampailha.guilhermeviana.com
# Container port: 9042 (uma acima da API, que roda na 9041)
# API: https://apisampailha.guilhermeviana.com/api/v1

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-stage
    expose:
      - "9042"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 9042
      NUXT_API_BASE: https://apisampailha.guilhermeviana.com/api/v1
      NUXT_PUBLIC_API_ORIGIN: https://apisampailha.guilhermeviana.com
      NUXT_PUBLIC_SITE_URL: https://sampailha.guilhermeviana.com
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      - "traefik.http.routers.sampa-ilha-web.rule=Host(`sampailha.guilhermeviana.com`)"
      - "traefik.http.routers.sampa-ilha-web.entrypoints=websecure"
      - "traefik.http.routers.sampa-ilha-web.tls=true"
      - "traefik.http.routers.sampa-ilha-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sampa-ilha-web.service=sampa-ilha-web"
      - "traefik.http.services.sampa-ilha-web.loadbalancer.server.port=9042"

      - "traefik.http.routers.sampa-ilha-web-http.rule=Host(`sampailha.guilhermeviana.com`)"
      - "traefik.http.routers.sampa-ilha-web-http.entrypoints=web"
      - "traefik.http.routers.sampa-ilha-web-http.middlewares=sampa-ilha-web-https"
      - "traefik.http.middlewares.sampa-ilha-web-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sampa-ilha-web-https.redirectscheme.permanent=true"
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
