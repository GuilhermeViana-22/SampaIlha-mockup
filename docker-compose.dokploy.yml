# Dokploy — frontend Portal Sampa na Ilha (Nuxt 4 SSR)
# URL: https://portalsampanailha.com.br
# Container port: 9042 (uma acima da API, que roda na 9041)
# API: https://api.portalsampanailha.com.br/api/v1

services:
  web:
    # Imagem pronta, construida fora da VPS. A VPS so faz `pull`.
    #
    # Antes aqui havia um `build:`, e o Dokploy compilava o Nuxt no servidor.
    # Nao cabia: a maquina tem 1 nucleo e 4 GB, o build pede ~1,7 GB de RAM e
    # ocupa o nucleo inteiro por minutos. Nesse intervalo Traefik, MySQL e o
    # proprio SSH ficam sem CPU — a VPS travava a cada deploy do front, com o
    # site no ar.
    #
    # Para publicar uma versao nova, na maquina de quem desenvolve:
    #
    #     ./scripts/publicar-imagem.sh
    #
    # e depois um deploy no painel do Dokploy, que so puxa a imagem.
    #
    # Para voltar a compilar na VPS (nao recomendado), troque esta linha por:
    #
    #     build: { context: ., dockerfile: Dockerfile, target: production-stage }
    image: ${IMAGEM_WEB:-ghcr.io/guilhermeviana-22/sampailha-web:latest}
    pull_policy: always
    expose:
      - "9042"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 9042
      NUXT_API_BASE: https://api.portalsampanailha.com.br/api/v1
      NUXT_PUBLIC_API_ORIGIN: https://api.portalsampanailha.com.br
      NUXT_PUBLIC_SITE_URL: https://portalsampanailha.com.br
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      - "traefik.http.routers.sampa-ilha-web.rule=Host(`portalsampanailha.com.br`)"
      - "traefik.http.routers.sampa-ilha-web.entrypoints=websecure"
      - "traefik.http.routers.sampa-ilha-web.tls=true"
      - "traefik.http.routers.sampa-ilha-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sampa-ilha-web.service=sampa-ilha-web"
      - "traefik.http.services.sampa-ilha-web.loadbalancer.server.port=9042"

      - "traefik.http.routers.sampa-ilha-web-http.rule=Host(`portalsampanailha.com.br`)"
      - "traefik.http.routers.sampa-ilha-web-http.entrypoints=web"
      - "traefik.http.routers.sampa-ilha-web-http.middlewares=sampa-ilha-web-https"
      - "traefik.http.middlewares.sampa-ilha-web-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sampa-ilha-web-https.redirectscheme.permanent=true"
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
